# 기술 사전: 표준 이름 + 별칭 + 종류(category) + 상위 기술(parent)
# 비교할 때 대소문자, 공백, "-", "_", "." 차이는 무시한다 (예: "spring-boot" = "Spring Boot").
# 추출 결과에서 사전에 없는 이름은 `uv run python -m pipeline.normalize`로 리포트를 뽑아 검토 후 추가한다.
#
# category: 아래 categories 중 하나. 집계에서 종류가 다른 기술(예: 모니터링 도구와 메시지 큐)이
#   섞이지 않게 거르는 데 쓴다.
# parent: 같은 계열로 묶어 셀 상위 기술 (예: Amazon MSK → Kafka). 한 단계만 두고, 호환 제품이거나
#   같은 클라우드라는 이유로는 묶지 않는다. 결정 근거는 docs/기획.md "기술 사전 구조".

categories = [
    "언어·런타임",
    "백엔드 프레임워크·라이브러리",
    "프론트엔드·모바일",
    "데이터베이스",
    "캐시",
    "검색 엔진",
    "스토리지",
    "메시지 브로커",
    "데이터 처리·파이프라인",
    "클라우드·인프라",
    "CI/CD·빌드",
    "관측성",
    "테스트·품질",
    "인증·보안",
    "AI 모델·학습",
    "LLM 애플리케이션",
    "AI 코딩 도구",
    "협업·개발 도구",
    "기타 클라우드 서비스",
]

