<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>답변 비교 검증</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4;
          --accent:#2563eb; --chosen:#dbeafe; --code:#f5f5f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --panel:#292524; --text:#f5f5f4;
          --muted:#a8a29e; --line:#44403c; --accent:#60a5fa; --chosen:#1e3a5f; --code:#1c1917; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { font-size:16px; }
  .progress { color:var(--muted); }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { width:34px; height:28px; border:1px solid var(--line); background:var(--panel);
               color:var(--text); border-radius:6px; cursor:pointer; }
  nav button.done { background:var(--chosen); }
  nav button.current { outline:2px solid var(--accent); }
  main { padding:16px; max-width:1500px; margin:0 auto; }
  .question { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
              margin-bottom:12px; }
  .question small { color:var(--muted); }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width: 900px) { .answers { grid-template-columns:1fr; } }
  .answer { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 16px 16px;
            overflow-x:auto; max-height:70vh; overflow-y:auto; }
  .answer h2.label { position:sticky; top:0; background:var(--panel); margin:0; padding:10px 0; font-size:18px; }
  .answer pre { background:var(--code); padding:10px; border-radius:6px; overflow-x:auto; }
  .answer table { border-collapse:collapse; font-size:13px; }
  .answer td, .answer th { border:1px solid var(--line); padding:4px 6px; }
  .choose { display:flex; gap:8px; margin:14px 0 6px; flex-wrap:wrap; }
  .choose button { flex:1; min-width:120px; padding:10px; border:1px solid var(--line); border-radius:8px;
                   background:var(--panel); color:var(--text); font-size:15px; cursor:pointer; }
  .choose button.on { background:var(--chosen); border-color:var(--accent); font-weight:600; }
  textarea { width:100%; min-height:48px; border:1px solid var(--line); border-radius:8px; padding:8px;
             background:var(--panel); color:var(--text); font:inherit; }
  .row { display:flex; gap:8px; margin-top:10px; }
  .row button { padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--panel);
                color:var(--text); cursor:pointer; }
  .row .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .help { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <b>답변 비교 검증</b><span class="progress" id="progress"></span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <button class="primary" id="export" style="padding:6px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer">결과 내려받기</button>
</header>
<main>
  <div class="question"><small id="qid"></small><div id="question"></div></div>
  <p class="help">질문한 개발자라고 생각하고, 실제로 더 도움이 되는 답을 고르세요.
  정확성, 실무 고려, 판단 근거, 상황 적합성, 전달을 함께 봅니다. 출처·사례가 붙어 있다는 것만으로 고르지 마세요.</p>
  <div class="answers">
    <div class="answer"><h2 class="label">A</h2><div id="a"></div></div>
    <div class="answer"><h2 class="label">B</h2><div id="b"></div></div>
  </div>
  <div class="choose">
    <button data-c="A">A가 낫다</button><button data-c="tie">비슷하다</button><button data-c="B">B가 낫다</button>
  </div>
  <textarea id="note" placeholder="이유 (선택)"></textarea>
  <div class="row"><button id="prev">이전</button><button id="next" class="primary">다음</button></div>
</main>
<script>
const ITEMS = __DATA__;
const KEY = "m7-human-review";
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let idx = 0;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} };
const md = (t) => DOMPurify.sanitize(marked.parse(t || ""));
function render() {
  const it = ITEMS[idx];
  document.getElementById("qid").textContent = it.item;
  document.getElementById("question").textContent = it.question;
  document.getElementById("a").innerHTML = md(it.a);
  document.getElementById("b").innerHTML = md(it.b);
  document.querySelectorAll(".answer").forEach((el) => (el.scrollTop = 0));
  const cur = answers[it.item] || {};
  document.querySelectorAll(".choose button").forEach((b) => b.classList.toggle("on", b.dataset.c === cur.choice));
  document.getElementById("note").value = cur.note || "";
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  ITEMS.forEach((x, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    if (answers[x.item] && answers[x.item].choice) b.classList.add("done");
    if (i === idx) b.classList.add("current");
    b.onclick = () => { idx = i; render(); };
    nav.appendChild(b);
  });
  const done = ITEMS.filter((x) => answers[x.item] && answers[x.item].choice).length;
  document.getElementById("progress").textContent = `${done} / ${ITEMS.length} 완료`;
  window.scrollTo(0, 0);
}
document.querySelectorAll(".choose button").forEach((b) => (b.onclick = () => {
  const it = ITEMS[idx];
  answers[it.item] = { ...(answers[it.item] || {}), choice: b.dataset.c };
  save(); render();
}));
document.getElementById("note").oninput = (e) => {
  const it = ITEMS[idx];
  answers[it.item] = { ...(answers[it.item] || {}), note: e.target.value };
  save();
};
document.getElementById("prev").onclick = () => { if (idx > 0) { idx--; render(); } };
document.getElementById("next").onclick = () => { if (idx < ITEMS.length - 1) { idx++; render(); } };
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify(answers, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "answers.json"; a.click();
};
render();
</script>
</body>
</html>
