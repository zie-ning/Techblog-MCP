# 모델별 단가 (USD / 100만 토큰). 평가 리포트가 run 비용과 전체 1,262편 추출 비용을 추정하는 데 쓴다.
# 출처: https://developers.openai.com/api/docs/pricing (checked 날짜 기준). pro 계열은 후보가 아니라 뺐다.
# cached_input은 캐시된 입력 토큰 단가, reasoning 토큰은 output 단가로 계산한다.
# batch는 Batch API 단가로, M4 전체 추출 비용 추정에 쓴다.

