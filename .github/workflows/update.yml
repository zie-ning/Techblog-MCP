name: 자동 갱신

# 새 글만 수집·추출해 검색 DB를 GitHub Release로 배포하고, 데이터 변경을 PR로 병합한다.
# 일부 실패·보류·탈락률 급등·수집 이상(종료 코드 2)은 성공분을 배포한 뒤 이슈로 알린다 (docs/기획.md "자동 갱신").
# 우아한형제들은 GitHub Actions IP를 막아(403) 빼고, 로컬에서 따로 갱신한다.
# 필요한 설정: 저장소 시크릿 OPENAI_API_KEY,
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:
    inputs:
      max_new:
        description: "블로그별 추출 대상 상한 (보류된 블로그를 확인한 뒤 올릴 때)"
        default: "30"

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write # 브랜치 push, Release 생성
  pull-requests: write
  issues: write

jobs:
  update:
    # 다른 브랜치에서 돌리면 데이터 PR에 그 브랜치의 병합 안 된 커밋까지 main으로 들어간다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # ci.yml과 같은 버전
        with:
          python-version: "3.14"
      - run: uv sync --locked

      - name: 새 글 수집·추출·확장·빌드
        id: update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_NEW: ${{ inputs.max_new || '30' }}
        run: |
          set +e
          uv run python -m pipeline.update --skip woowahan --max-new "$MAX_NEW"             --summary-file "$RUNNER_TEMP/summary.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          # 0 정상, 2 일부 실패(성공분은 배포), 그 밖은 실행 불가
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          if [ -n "$(git status --porcelain -- data)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # 봇이 만든 PR에서는 CI 워크플로가 돌지 않으므로 같은 검사를 여기서 한다
      - name: 테스트
        if: steps.update.outputs.changed == 'true'
        run: |
          uv run ruff check
          uv run pytest

      - name: 검색 DB Release 배포
        if: steps.update.outputs.changed == 'true'
        run: uv run python -m pipeline.release_db --upload

      - name: 데이터 변경 PR 생성·병합
        if: steps.update.outputs.changed == 'true'
        run: |
          tag=$(jq -r .tag src/techblog_mcp/db_release.json)
          branch="chore/data-update-${{ github.run_number }}"
          title="chore: 자동 갱신 데이터 반영 ($tag)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data src/techblog_mcp/db_release.json
          git commit -m "$title" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          # 막 만든 PR은 병합 가능 여부 계산이 끝나지 않았을 수 있어 몇 번 다시 시도한다
          for i in 1 2 3 4 5; do
            if gh pr merge "$branch" --merge --delete-branch; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: 문제 알림 이슈
        if: always() && (failure() || steps.update.outputs.code != '0')
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            if [ -f "$RUNNER_TEMP/summary.md" ]; then
              cat "$RUNNER_TEMP/summary.md"
            else
              echo "실행 요약이 없습니다. 갱신 명령이 시작되지 못했거나 중간에 멈췄습니다."
            fi
            echo
            echo "갱신 종료 코드: ${{ steps.update.outputs.code || '없음' }}, 작업 상태: ${{ job.status }}"
            echo "실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body"
          gh label create auto-update --color D93F0B --description "자동 갱신 문제 알림" --force
          # 열린 알림 이슈가 있으면 댓글로 이어 붙여 이슈가 쌓이지 않게 한다
          number=$(gh issue list --label auto-update --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "fix: 자동 갱신 문제 확인 필요" --label auto-update --body-file "$body"
          fi
